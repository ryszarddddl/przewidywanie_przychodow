version: '3'
services:
  app:
    image: przewidywanie_plac:latest
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_URL: ${API_URL:-http://0.0.0.0:8000}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
